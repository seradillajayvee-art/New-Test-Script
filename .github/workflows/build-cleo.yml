name: build-cleo

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/build-cleo.yml']
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Sanny Builder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "${{ vars.SANNY_INSTALLER_URL || 'https://sannybuilder.com/downloads/SannyBuilder4Setup.exe' }}"
          Write-Host "Downloading: $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\sb.exe"
          Get-Item "$env:RUNNER_TEMP\sb.exe" | Select-Object Name, Length

      - name: Install (try silent flags until sanny.exe appears)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP\sb.exe"
          $flagsets = @(
            '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-',
            '/SILENT /SUPPRESSMSGBOXES /NORESTART',
            '/S'
          )
          $paths = @(
            'C:\Program Files',
            'C:\Program Files (x86)',
            "$env:LOCALAPPDATA\Programs"
          )
          $found = $null
          foreach ($f in $flagsets) {
            Write-Host "--- trying: $f"
            try { Start-Process $exe -ArgumentList $f -Wait -ErrorAction Stop } catch { Write-Host $_ }
            $found = Get-ChildItem $paths -Recurse -Filter 'sanny.exe' -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { break }
          }
          if (-not $found) { throw 'sanny.exe not found after install — set SANNY_INSTALLER_URL or install manually' }
          Write-Host "found: $($found.FullName)"
          $found.FullName | Out-File -FilePath sanny_path.txt -Encoding utf8

      - name: Show CLI help (debug)
        shell: pwsh
        run: |
          $sanny = Get-Content sanny_path.txt -Raw
          & $sanny --help
        continue-on-error: true

      - name: Compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sanny = (Get-Content sanny_path.txt -Raw).Trim()
          New-Item -ItemType Directory -Force build | Out-Null
          & $sanny --mode=sa --no-splash --compile "src\realspread.txt" "build\realspread.cs"
          if ($LASTEXITCODE -ne 0) { throw "compiler exited $LASTEXITCODE" }
          if (-not (Test-Path 'build\realspread.cs')) { throw 'no output file produced' }
          $size = (Get-Item 'build\realspread.cs').Length
          Write-Host "output size: $size bytes"
          if ($size -lt 64) { throw 'output suspiciously small — script likely failed' }

      - name: Rename to .csa
        shell: pwsh
        run: Copy-Item build\realspread.cs build\realspread.csa

      - uses: actions/upload-artifact@v4
        with:
          name: cleo-csa
          path: build/*.csa
